{% extends "layout.html" %}
{% load static %}

{% block title %}
    CineValue
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'CineValue/style.css' %}">
{% endblock %}

{% block content %}
<div class="page">
  <div class="search-wrap" role="search">
    <input
      class="search-input"
      autocomplete="off"
      autofocus
      name="movie_name"
      placeholder="Movie name"
      type="search"
      aria-label="Search movies"
    >
    <ul class="results" role="listbox"></ul>
  </div>
</div>

    <script>
       
        const input = document.querySelector('input');

    
        input.addEventListener('input', async () => {
        // Отправляем GET-запрос на своё /search?q=...
        const response = await fetch('/search?q=' + encodeURIComponent(input.value));
        const movies   = await response.json();

        // Собираем HTML списка
        let html = '';
        movies.forEach(movie => {
      
            const safeTitle = movie.title
                            .replace(/&/g, '&amp;')
                            .replace(/</g, '&lt;')
                            .replace(/>/g, '&gt;');

            
            const year = movie.year ?? 'N/A';

            
            html += `<li>
                    <a href="/search/${movie.id}/">
                        ${safeTitle} (${year})
                    </a>
                    </li>`;
        });


        document.querySelector('ul').innerHTML = html;
        });
    </script>
   
{% endblock %}
