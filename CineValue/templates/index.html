{% extends "layout.html" %}
{% load static %}

{% block title %}
    CineValue
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'CineValue/style.css' %}">
{% endblock %}

{% block content %}
<div class="page">
  <div class="search-wrap" role="search">
    <input
      class="search-input"
      autocomplete="off"
      autofocus
      name="movie_name"
      placeholder="Movie name"
      type="search"
      aria-label="Search movies"
    >
    <ul class="results" role="listbox"></ul>
  </div>
</div>

      <script>
      document.addEventListener('DOMContentLoaded', () => {
        const input = document.querySelector('.search-input'); // или: document.getElementById('movie-search')
        const list  = document.querySelector('.results');
        if (!input || !list) return;

        input.addEventListener('input', async () => {
          const q = input.value.trim();
          if (!q) { list.innerHTML = ''; return; }

          const res = await fetch('/search/?q=' + encodeURIComponent(q)); // trailing slash
          const movies = await res.json();

          let html = '';
          movies.forEach(m => {
            const safe = m.title.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
            html += `<li><a href="/search/${m.id}/">${safe} (${m.year ?? 'N/A'})</a></li>`;
          });
          list.innerHTML = html;
        });
      });
      </script>

   
{% endblock %}
