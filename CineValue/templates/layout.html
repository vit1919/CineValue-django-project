{% load static %}
<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}CineValue{% endblock %}</title>


  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
    crossorigin="anonymous"
  />
  {% block extra_css %}{% endblock %}
</head>

<body style="background: #0d1117;">
  
  <nav class="navbar navbar-expand-lg sticky-top" style="background: #161b22; border-bottom: 1px solid #30363d;">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-semibold" href="{% url 'index' %}" style="color: #e6edf3;">
        CineValue
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation"
              style="border-color: #30363d;">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">

      {% if user.is_authenticated %}
        <form action="{% url 'logout' %}" method="post" class="d-inline">
          {% csrf_token %}
          <button type="submit" class="nav-link btn btn-link p-0" style="color:#e6edf3; text-decoration:none;">
            Log out
          </button>
        </form>
      {% else %}
        <a class="nav-link me-3" href="{% url 'login' %}">Log in</a>
        <a class="nav-link me-3" href="{% url 'signup' %}">Sign up</a>
      {% endif %}

      </div>
    </div>
  </nav>

  <!-- Контент без container для полного экрана -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
          crossorigin="anonymous"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
