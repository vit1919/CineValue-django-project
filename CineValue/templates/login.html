{% extends "layout.html" %}

{% block title %}Log In | CineValue{% endblock %}

{% block extra_css %}
<style>
  .auth-container {
    min-height: calc(100vh - 80px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .auth-card {
    width: 100%;
    max-width: 400px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 24px;
    padding: 2.5rem;
    backdrop-filter: blur(20px);
  }
  .auth-card h2 {
    color: #fff;
    font-size: 1.75rem;
    font-weight: 700;
    margin-bottom: 0.5rem;
    text-align: center;
  }
  .auth-card .subtitle {
    color: rgba(255, 255, 255, 0.5);
    text-align: center;
    margin-bottom: 2rem;
    font-size: 0.9rem;
  }
  .auth-card p {
    margin-bottom: 1.25rem;
  }
  .auth-card label {
    display: block;
    color: rgba(255, 255, 255, 0.7);
    font-size: 0.85rem;
    font-weight: 500;
    margin-bottom: 0.5rem;
  }
  .auth-card input[type="text"],
  .auth-card input[type="password"],
  .auth-card input[type="email"] {
    width: 100%;
    padding: 0.875rem 1rem;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    color: #fff;
    font-size: 1rem;
    transition: all 0.2s ease;
  }
  .auth-card input:focus {
    outline: none;
    border-color: rgba(124, 58, 237, 0.5);
    background: rgba(255, 255, 255, 0.08);
  }
  .auth-card input::placeholder {
    color: rgba(255, 255, 255, 0.3);
  }
  .auth-btn {
    width: 100%;
    padding: 0.875rem;
    background: #7c3aed;
    border: none;
    border-radius: 12px;
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    margin-top: 0.5rem;
  }
  .auth-btn:hover {
    background: #6d28d9;
    transform: translateY(-1px);
  }
  .auth-footer {
    text-align: center;
    margin-top: 1.5rem;
    color: rgba(255, 255, 255, 0.5);
    font-size: 0.9rem;
  }
  .auth-footer a {
    color: #a78bfa;
    text-decoration: none;
    font-weight: 500;
  }
  .auth-footer a:hover {
    color: #c4b5fd;
  }
  .auth-card .helptext {
    font-size: 0.75rem;
    color: rgba(255, 255, 255, 0.4);
    margin-top: 0.5rem;
  }
  .auth-card .errorlist {
    list-style: none;
    padding: 0;
    margin: 0.5rem 0 0 0;
  }
  .auth-card .errorlist li {
    color: #f87171;
    font-size: 0.8rem;
  }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <h2>Welcome back</h2>
    <p class="subtitle">Sign in to your account</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="auth-btn">Log In</button>
    </form>
    <p class="auth-footer">
      Don't have an account? <a href="{% url 'signup' %}">Sign Up</a>
    </p>
  </div>
</div>
{% endblock %}
