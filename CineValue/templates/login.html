{% extends "layout.html" %}

{% block title %}Log In | CineValue{% endblock %}

{% block extra_css %}
<style>
  .auth-container {
    min-height: calc(100vh - 65px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .auth-card {
    width: 100%;
    max-width: 400px;
    background: #1a1a1e;
    border: 1px solid #2c2c30;
    border-radius: 12px;
    padding: 2.5rem;
  }
  .auth-card h2 {
    color: #e8e6e3;
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 1.75rem;
    font-weight: 700;
    margin-bottom: 0.5rem;
    text-align: center;
  }
  .auth-card .subtitle {
    color: #7a7a7e;
    text-align: center;
    margin-bottom: 2rem;
    font-size: 0.9rem;
  }
  .auth-card p {
    margin-bottom: 1.25rem;
  }
  .auth-card label {
    display: block;
    color: #7a7a7e;
    font-size: 0.85rem;
    font-weight: 500;
    margin-bottom: 0.5rem;
  }
  .auth-card input[type="text"],
  .auth-card input[type="password"],
  .auth-card input[type="email"] {
    width: 100%;
    padding: 0.875rem 1rem;
    background: #0f0f0f;
    border: 1px solid #2c2c30;
    border-bottom: 2px solid #2c2c30;
    border-radius: 6px;
    color: #e8e6e3;
    font-size: 1rem;
    transition: border-color 0.2s ease;
  }
  .auth-card input:focus {
    outline: none;
    border-color: #e87b35;
    border-bottom-color: #e87b35;
  }
  .auth-card input::placeholder {
    color: #7a7a7e;
  }
  .auth-btn {
    width: 100%;
    padding: 0.875rem;
    background: #e87b35;
    border: none;
    border-radius: 6px;
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s ease;
    margin-top: 0.5rem;
  }
  .auth-btn:hover {
    background: #d4692a;
  }
  .auth-footer {
    text-align: center;
    margin-top: 1.5rem;
    color: #7a7a7e;
    font-size: 0.9rem;
  }
  .auth-footer a {
    color: #e87b35;
    text-decoration: none;
    font-weight: 500;
  }
  .auth-footer a:hover {
    color: #d4692a;
  }
  .auth-card .helptext {
    font-size: 0.75rem;
    color: #7a7a7e;
    margin-top: 0.5rem;
  }
  .auth-card .errorlist {
    list-style: none;
    padding: 0;
    margin: 0.5rem 0 0 0;
  }
  .auth-card .errorlist li {
    color: #ef4444;
    font-size: 0.8rem;
  }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <h2>Welcome back</h2>
    <p class="subtitle">Sign in to your account</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="auth-btn">Log In</button>
    </form>
    <p class="auth-footer">
      Don't have an account? <a href="{% url 'signup' %}">Sign Up</a>
    </p>
  </div>
</div>
{% endblock %}
