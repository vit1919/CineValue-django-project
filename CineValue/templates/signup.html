{% extends "layout.html" %}
{% load static %}

{% block title %}
    CineValue
{% endblock %}


{% block content %}

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <h2>Sign Up</h2>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Sign Up</button>
            </form>
            <p class="mt-3">
                Already have an account? <a href="{% url 'login' %}">Log in</a>
            </p>
        </div>
    </div>
</div>

{% endblock %}
